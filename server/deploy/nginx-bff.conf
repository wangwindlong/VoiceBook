# BFF gets its own server block: Authelia already owns /api/oidc and /api on :8461,
# so the two cannot share a host:port. Adjust certificate paths to your acme setup.
server {
    listen 8462 ssl;
    http2 on;
    server_name nas.wangyl.work;

    ssl_certificate     /etc/nginx/certs/nas.wangyl.work/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/nas.wangyl.work/key.pem;

    # Request bodies are small JSON; book downloads are responses and unaffected.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8460;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Always overwrite: the BFF trusts X-Real-IP for rate limiting.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
